name: Set up locked PHP quality environment
description: Install the selected PHP runtime and the repository's locked Composer dependencies.

inputs:
  php-version:
    description: PHP minor or rolling alias accepted by setup-php.
    required: true
  install-phpcompatibility:
    description: Install the isolated PHPCS 4 PHPCompatibilityWP toolchain.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up PHP
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ctype, dom, fileinfo, filter, gd, iconv, libxml, mbstring, mysqli, simplexml, xml, xmlreader, xmlwriter, zip, zlib
        tools: composer:v2
        coverage: none
      env:
        fail-fast: "true"

    - name: Log exact tool versions
      shell: bash
      run: |
        php --version
        php -r 'printf("PHP integer size: %d bytes\n", PHP_INT_SIZE);'
        composer --version

    - name: Resolve Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Restore Composer download cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.directory }}
        key: composer-${{ runner.os }}-php-${{ inputs.php-version }}-${{ hashFiles('composer.lock', 'tools/phpcompatibility/composer.lock') }}
        restore-keys: |
          composer-${{ runner.os }}-php-${{ inputs.php-version }}-

    - name: Install locked project dependencies
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Install isolated compatibility scanner
      if: ${{ inputs.install-phpcompatibility == 'true' }}
      shell: bash
      run: composer run qa:install-phpcompatibility
